[package]
name = "flashbulb"
description = "Screenshot testing infrastructure: RGBA images, Playwright-compatible pixel comparison, and golden-file management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (AGENTS.md, "Benchmarks are
# only the `benches/` targets").
bench = false

[features]
default = []
render = ["dep:dom"]

[dependencies]
png = { workspace = true }

dom = { workspace = true, optional = true }

[lints]
workspace = true
