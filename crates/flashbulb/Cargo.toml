[package]
name = "flashbulb"
description = "Screenshot testing infrastructure: RGBA images, Playwright-compatible pixel comparison, and golden-file management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The comparison half — images, pixelmatch, goldens — has no renderer and no
# GPU. Any crate can dev-depend on it.
default = []
# Adds the capture half: ask `dom` to render through its private painter and
# submit the retained scene through `pulsar`'s headless GPU surface.
render = ["dep:dom", "dep:pulsar"]

[dependencies]
png = { workspace = true }

dom = { workspace = true, optional = true }
pulsar = { workspace = true, optional = true }

[lints]
workspace = true
