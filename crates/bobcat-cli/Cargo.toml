[package]
name = "bobcat-cli"
description = "Native Bobcat CLI and HTTP screenshot embedders"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (AGENTS.md, "Benchmarks are
# only the `benches/` targets").
bench = false

[features]
default = ["cli", "server"]
cli = ["dep:flume", "dep:png", "dep:pollster", "dep:winit"]
server = [
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:chrono",
    "dep:hmac",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:socket2",
    "dep:tokio",
    "dep:uuid",
    "dep:ve-tos-rust-sdk",
]

[[bin]]
name = "bobcat"
path = "src/bin/bobcat.rs"
required-features = ["cli"]
bench = false

[[bin]]
name = "bobcat-server"
path = "src/bin/bobcat-server.rs"
required-features = ["server"]
bench = false

[[test]]
name = "headless_cli"
required-features = ["cli"]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
ve-tos-rust-sdk = { workspace = true, optional = true }
bobcat-core = { workspace = true }
bobcat-resources = { workspace = true }
bobcat-source = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
flume = { workspace = true, optional = true }
png = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
axum = { workspace = true, features = ["multipart"], optional = true }
reqwest = { workspace = true, features = ["rustls"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { workspace = true, optional = true }

[dev-dependencies]
crc64fast = { workspace = true }
image = { workspace = true, features = ["bmp"] }
zip = { workspace = true }
flashbulb = { workspace = true, features = ["render"] }
rkyv = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
