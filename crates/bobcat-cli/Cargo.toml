[package]
name = "bobcat-cli"
description = "Native command-line runner and renderer for Bobcat web bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bobcat"
path = "src/main.rs"

[dependencies]
bobcat-core = { workspace = true, features = ["quickjs", "renderer"] }
lynx-template-decoder = { workspace = true }
png = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
winit = { workspace = true }

[dev-dependencies]
# The e2e test's mandatory GPU probe and PNG verification.
flashbulb = { workspace = true, features = ["render"] }

[lints]
workspace = true
