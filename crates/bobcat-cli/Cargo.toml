[package]
name = "bobcat-cli"
description = "Native command-line runner and renderer for Bobcat web bundles and Lynx XML"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bobcat"
path = "src/main.rs"

[dependencies]
bobcat-core = { workspace = true }
bobcat-resources = { workspace = true }
bobcat-source = { workspace = true }
flume = { workspace = true }
png = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { workspace = true }

[dev-dependencies]
flashbulb = { workspace = true, features = ["render"] }
rkyv = { workspace = true }

[lints]
workspace = true
