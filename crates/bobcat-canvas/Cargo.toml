[package]
name = "bobcat-canvas"
description = "The HTML Canvas 2D drawing model, recorded as terminus display lists and replayed on the GPU: bitmap, context state, paths, paints, text and pixel access"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (docs/testing.md, "Benchmarks are
# only the `benches/` targets").
bench = false

[dependencies]
skrifa = { workspace = true }
terminus = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { workspace = true, features = ["complex-scripts"] }

[lints]
workspace = true
