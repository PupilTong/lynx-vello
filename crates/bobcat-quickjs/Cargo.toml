[package]
name = "bobcat-quickjs"
description = "QuickJS ScriptEngine adapter and runtime composition for Bobcat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bobcat-engine = { workspace = true }
quickjs-rust-bridge = { workspace = true }

# The Lynx element vocabulary the host globals installed here speak. AGENTS.md
# places "Lynx host globals" in this crate rather than in the engine-neutral
# protocol or the generic QuickJS bridge, so this is where the Element PAPI
# meets the element tree.
lynx-element = { workspace = true }

[dev-dependencies]
# The screenshot and PAPI tests read the tree the host globals build.
dom = { workspace = true }
lynx-element = { workspace = true }
# The `web_bundle` test runs a real vendored `.web.bundle`'s main-thread
# script, pinning exactly how far bundle support reaches today.
lynx-template-decoder = { workspace = true }
# The screenshot harness: capture through `pulsar`, compare against goldens.
flashbulb = { workspace = true, features = ["render"] }

[lints]
workspace = true
