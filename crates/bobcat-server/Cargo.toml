[package]
name = "bobcat-server"
description = "HTTP screenshot embedder for Bobcat web bundles and Lynx XML"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bobcat-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
bobcat-core = { workspace = true }
bobcat-resources = { workspace = true }
bobcat-source = { workspace = true, features = ["runtime", "web-bundle"] }
image = { workspace = true, features = ["jpeg"] }
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
url = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
