[package]
name = "dom"
description = "Generic W3C DOM, Stylo/layout core, and document-owned Vello paint pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
layout-test-utils = ["hughie/layout-test-utils"]

[dependencies]
flume = { workspace = true }
rustc-hash = { workspace = true }
slab = { workspace = true }
smallvec = { workspace = true }
pollster = { workspace = true }
vello = { workspace = true, features = ["wgpu", "wgpu_default"] }

hughie = { workspace = true }

stylo = { workspace = true }
stylo_atoms = { workspace = true }
stylo_dom = { workspace = true }
stylo_traits = { workspace = true }
selectors = { workspace = true }
app_units = { workspace = true }
cssparser = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { workspace = true }
rayon = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { workspace = true, features = ["complex-scripts"] }

[dev-dependencies]
divan = { workspace = true }
flashbulb = { workspace = true, features = ["render"] }
html5ever = { workspace = true }
markup5ever_rcdom = { workspace = true }
png = { workspace = true }

[[bench]]
name = "animation"
harness = false

[[bench]]
name = "css"
harness = false

[[bench]]
name = "paint"
harness = false

[[bench]]
name = "custom_elements"
harness = false

[[bench]]
name = "shadow"
harness = false

[[bench]]
name = "query_selector"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[lints]
workspace = true
