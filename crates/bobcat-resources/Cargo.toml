[package]
name = "bobcat-resources"
description = "Cross-platform reference ResourceFetcher for Bobcat: MIME preprocessing, tiered caching, and platform image decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bobcat-core = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` builds for wasm32 (bobcat-core already proves it) but only the native
# executor uses it; `sync` carries the completion channel on both targets.
tokio = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true }
# The executor's stop signal. Native only: the browser has no runtime here.
tokio-util = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }
web-sys = { workspace = true, features = [
    "Headers",
    "MessageEvent",
    "MessagePort",
    "Request",
    "RequestCache",
    "RequestInit",
    "Response",
    "WorkerGlobalScope",
] }

[dev-dependencies]
bobcat-source = { workspace = true }
flashbulb = { workspace = true, features = ["render"] }
flume = { workspace = true }
png = { workspace = true }
# `rt` and `sync` come from `[dependencies]`; every test is a default-flavour
# `#[tokio::test]`, so only the attribute macro is missing.
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
