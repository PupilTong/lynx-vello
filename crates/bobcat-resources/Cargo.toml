[package]
name = "bobcat-resources"
description = "Cross-platform reference ResourceFetcher for Bobcat: MIME preprocessing, tiered caching, and platform image decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (AGENTS.md, "Benchmarks are
# only the `benches/` targets").
bench = false

[dependencies]
bobcat-core = { workspace = true }
vant = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `rt` builds for wasm32 (bobcat-core already proves it) but only the native
# executor uses it; `sync` carries the completion channel on both targets.
tokio = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true }
# Retained resources — fonts — are handed over as shared read-only mappings.
memmap2 = { workspace = true }
# The executor's stop signal. Native only: the browser has no runtime here.
tokio-util = { workspace = true }

# In the browser a load is a local task on the Render Worker, and the clock
# is `Date`; the browser's adapters themselves are `bobcat-wasm`'s.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
bobcat-source = { workspace = true }
prime-radiant = { workspace = true, features = ["render"] }
flume = { workspace = true }
png = { workspace = true }
# `rt` and `sync` come from `[dependencies]`; every test is a default-flavour
# `#[tokio::test]`, so only the attribute macro is missing.
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
