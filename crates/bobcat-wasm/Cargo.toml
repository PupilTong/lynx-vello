[package]
name = "bobcat-wasm"
description = "Browser WebAssembly embedder for Bobcat Canvas rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bobcat-core = { workspace = true }
js-sys = { workspace = true }
parking_lot_core = { workspace = true }
rayon = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_thread = { workspace = true }
web-sys = { workspace = true, features = ["OffscreenCanvas", "WorkerGlobalScope"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
