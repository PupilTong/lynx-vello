[package]
name = "bobcat-wasm"
description = "Browser WebAssembly embedder for Bobcat Canvas rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (docs/testing.md, "Benchmarks are
# only the `benches/` targets").
bench = false
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bobcat-core = { workspace = true }
bobcat-resources = { workspace = true }
bobcat-source = { workspace = true }
# `src/platform`: the browser's `vant::Platform` — `fetch`, the Render
# Worker's image decoders, and the code cache's store in the Cache API.
bytes = { workspace = true }
http = { workspace = true }
js-sys = { workspace = true }
parking_lot_core = { workspace = true }
# A code cache entry's record, carried in a header.
serde_json = { workspace = true }
url.workspace = true
vant = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Cache",
    "CacheStorage",
    "ColorSpaceConversion",
    "Headers",
    "ImageBitmap",
    "ImageBitmapOptions",
    "ImageOrientation",
    "OffscreenCanvas",
    "PremultiplyAlpha",
    "ReadableStream",
    "Request",
    "RequestCache",
    "RequestInit",
    "ResizeQuality",
    "Response",
    "ResponseInit",
    "StorageManager",
    "VideoFrame",
    "WorkerGlobalScope",
] }
# The wall clock `bobcat-core`'s `ExtraTiming` marks are typed in on this
# target: core reads `web_time`'s `SystemTime` where `std`'s panics.
web-time = { workspace = true }

# `src/text_input.rs` is the browser seam's pure half: its native tests are
# the one native build of this crate that links the engine.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bobcat-core = { workspace = true }
# `src/image_frames.rs`, the browser decoder's pure half.
vant = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--strip-debug",
    "--enable-threads",
    "--enable-bulk-memory",
    "--enable-bulk-memory-opt",
    "--enable-extended-const",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-simd",
    "--enable-relaxed-simd",
    "--enable-sign-ext",
    "--enable-tail-call",
]

[lints]
workspace = true
