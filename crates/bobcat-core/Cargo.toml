[package]
name = "bobcat-core"
description = "Native Lynx runtime core and its built-in QuickJS script engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = { workspace = true }
dom = { workspace = true }
http = { workspace = true }
pollster = { workspace = true }
quickjs-rust-bridge = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { workspace = true }
wasm_thread = { workspace = true }

web-time = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
flashbulb = { workspace = true, features = ["render"] }
lynx-template-decoder = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "script_boundary"
harness = false

[lints]
workspace = true
