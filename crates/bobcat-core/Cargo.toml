[package]
name = "bobcat-core"
description = "Native Lynx runtime core and its built-in QuickJS script engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bytes = { workspace = true }
dom = { workspace = true }
http = { workspace = true }
quickjs-rust-bridge = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-util = { workspace = true }
url = { workspace = true }

# The engine threads wait out their own realms' timers on tokio's timer.
# It reads `std::time::Instant`, which panics on wasm32-unknown-unknown, so
# that target gets `src/alarm.rs` instead and never enables this driver.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { workspace = true }
wasm_thread = { workspace = true }

web-time = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
flume = { workspace = true }
flashbulb = { workspace = true, features = ["render"] }
bobcat-source = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "script_boundary"
harness = false

[lints]
workspace = true
