[package]
name = "bobcat-core"
description = "Native Lynx runtime core with injectable script engines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["quickjs"]
quickjs = ["dep:quickjs-rust-bridge"]
# Test-support surface: deterministic garbage collection with element-drop
# delivery (MainThreadRuntime::collect_garbage). Enabled by this crate's own
# integration tests through the dev-dependency below; never a default.
gc-test-utils = []

[dependencies]
bytes = { workspace = true }
data-url = { workspace = true }
dom = { workspace = true }
http = { workspace = true }
pollster = { workspace = true }
quickjs-rust-bridge = { workspace = true, optional = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
bobcat-core = { workspace = true, features = ["quickjs", "gc-test-utils"] }
flashbulb = { workspace = true, features = ["render"] }
lynx-template-decoder = { workspace = true }
png = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
