[package]
name = "bobcat-core"
description = "Native Lynx runtime core with injectable script engines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["quickjs"]
quickjs = ["dep:quickjs-rust-bridge"]

[dependencies]
bytes = { workspace = true }
data-url = { workspace = true }
dom = { workspace = true }
http = { workspace = true }
pollster = { workspace = true }
quickjs-rust-bridge = { workspace = true, optional = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { workspace = true }
wasm_thread = { workspace = true }

web-time = { workspace = true }

[dev-dependencies]
flashbulb = { workspace = true, features = ["render"] }
lynx-template-decoder = { workspace = true }
png = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
