[package]
name = "terminus"
description = "Generic W3C DOM, Stylo/layout core, and document-owned paint pipeline over vello_gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Only `benches/` holds benchmarks: keep `cargo build --benches` from compiling
# this target a second time as a bench harness (AGENTS.md, "Benchmarks are
# only the `benches/` targets").
bench = false

[features]
layout-test-utils = ["seldon/layout-test-utils"]
# The presenting painter's test surface: a painter with no draw target, a
# pinnable frame clock, and read access to its gesture router and scroll
# intents, for an owner's own tests (`docs/terminus-link-api.md`).
painter-test-utils = []

[dependencies]
bytes = { workspace = true }
flume = { workspace = true }
rustc-hash = { workspace = true }
slab = { workspace = true }
smallvec = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
vello_gpu = { workspace = true }
glifo = { workspace = true }
wgpu = { workspace = true }
roxmltree = { workspace = true }
siphasher = { workspace = true }
svgtypes = { workspace = true }

seldon = { workspace = true }

stylo = { workspace = true }
stylo_atoms = { workspace = true }
stylo_dom = { workspace = true }
stylo_traits = { workspace = true }
selectors = { workspace = true }
app_units = { workspace = true }
cssparser = { workspace = true }
euclid = { workspace = true }
url = { workspace = true }
vant = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { workspace = true }
# The engine's monotonic clock (`src/clock.rs`, `link::clock`):
# `std::time::Instant` panics on wasm32-unknown-unknown.
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { workspace = true, features = ["complex-scripts"] }

[dev-dependencies]
divan = { workspace = true }
prime-radiant = { workspace = true, features = ["render"] }
html5ever = { workspace = true }
markup5ever_rcdom = { workspace = true }
png = { workspace = true }

# The painter's window stack is tested over a bare `CAMetalLayer` surface
# (`painter/graphics.rs`), which needs no window and no main thread.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-quartz-core = { workspace = true }

[[test]]
name = "wpt"
harness = false

[[bench]]
name = "animation"
harness = false

[[bench]]
name = "container_units"
harness = false

[[bench]]
name = "css"
harness = false

[[bench]]
name = "paint"
harness = false

[[bench]]
name = "custom_elements"
harness = false

[[bench]]
name = "shadow"
harness = false

[[bench]]
name = "query_selector"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[lints]
workspace = true

[[bench]]
name = "culling"
harness = false
