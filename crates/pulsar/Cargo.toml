[package]
name = "pulsar"
description = "Vello scene resources and GPU backend for the DOM paint pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pollster.workspace = true
rustc-hash.workspace = true
# The workspace entry turns vello's defaults off so `crates/image` can reach
# `peniko` without wgpu; Pulsar owns GPU submission, so it opts the GPU back in.
vello = { workspace = true, features = ["wgpu", "wgpu_default"] }

[lints]
workspace = true
