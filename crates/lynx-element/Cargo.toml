[package]
name = "lynx-element"
description = "Lynx runtime element policy and Element PAPI host over dom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Trusted workspace consumers that compose painting directly. This is not part
# of the default element/PAPI surface.
internal-document-access = []

[dependencies]
# The one dependency: this layer reaches stylo/euclid/vello exclusively
# through `dom`'s vocabulary re-exports (strict linear layering).
dom = { workspace = true }

[lints]
workspace = true
