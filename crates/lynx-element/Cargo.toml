[package]
name = "lynx-element"
description = "Lynx runtime element policy and Element PAPI host over bobcat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["quickjs"]
quickjs = ["bobcat-core/quickjs"]

[dependencies]
bobcat-core = { workspace = true, default-features = false }

# Device construction is this layer's job ("view metrics and device
# construction" in the runtime-adapter row of docs/style-architecture.md), so
# the stylo `Device` and its font-metrics provider are built here.
euclid = { workspace = true }
stylo = { workspace = true }
stylo_traits = { workspace = true }

[dev-dependencies]
flashbulb = { workspace = true, features = ["render"] }
lynx-template-decoder = { workspace = true }

[lints]
workspace = true
