[package]
name = "lynx-element"
description = "Lynx runtime element policy and Element PAPI host over dom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Trusted workspace consumers that compose painting directly. This is not part
# of the default element/PAPI surface.
internal-document-access = []

[dependencies]
dom = { workspace = true }

# Device construction is this layer's job ("view metrics and device
# construction" in the runtime-adapter row of docs/style-architecture.md), so
# the stylo `Device` and its font-metrics provider are built here.
euclid = { workspace = true }
stylo = { workspace = true }
stylo_traits = { workspace = true }

[lints]
workspace = true
