[package]
name = "image-decoders"
description = "The sanctioned Decoder implementations an embedder injects into `image`: Apple ImageIO, Windows WIC, Android AImageDecoder, and the Linux-only pure-Rust reference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The contract this crate implements lives in the engine crate, as
# `bobcat_core::image`. The workspace entry declines the `quickjs` default, so
# the Windows/Android implementations stay checkable from any host with
# nothing but `cargo check --target`.
bobcat-core = { workspace = true }
# Post-decode resampling, shared by every implementation: none of them can hit a
# non-aspect-preserving target during decode, and naive resampling halos
# transparent edges — `ResizeOptions::use_alpha` does the alpha-correct thing.
fast_image_resize = { workspace = true }

# The Linux-only reference decoder. These are exactly the three codecs the
# crates.io `image` facade delegates to, taken directly (see the workspace
# manifest for why the facade was rejected). Linux is the one supported OS with
# no system still-image decode API, and headless CI runs there; every other
# target ships the platform decoder alone.
[target.'cfg(target_os = "linux")'.dependencies]
image-webp = { workspace = true }
png = { workspace = true }
zune-jpeg = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-image-io = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
libc = { workspace = true }
ndk-sys = { workspace = true }

[dev-dependencies]
# PNG fixtures are generated in-process with `png`'s encoder rather than
# committed; the Apple tests need it on macOS too, where the normal-dependency
# `png` above is not compiled.
png = { workspace = true }

[lints]
workspace = true
