# Codecov reads this from the default branch and from a pull request's head.
#
# CI uploads one lcov report per `test` shard, two per commit (`cargo llvm-cov`
# with the selection `.github/scripts/ci-shards.py` prints, vendor excluded at
# the source), and Codecov merges them. Everything about *reading* the merged
# report lives here:
# what counts as production source, one component per crate so a crate's
# coverage is a number in the PR comment rather than a `--fail-under` in the
# workflow, and statuses that inform without gating.

# A report built from one shard alone would show the other shard's crates as
# uncovered, so Codecov waits for both uploads before it sends a status or a
# comment.
codecov:
  notify:
    after_n_builds: 2

# cargo-llvm-cov already leaves `tests/`, `benches/`, `*_tests.rs` and the
# vendored stylo out of the report it uploads; this keeps that true should the
# upload ever change, so every number here is production source only.
ignore:
  - "**/tests/**"
  - "**/benches/**"
  - "vendor/**"

coverage:
  status:
    # Neither status can turn red: the workflow has no coverage threshold, and
    # neither does Codecov. Drop `informational` to make one a gate again.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        informational: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
  individual_components:
    - component_id: seldon
      name: seldon
      paths:
        - crates/seldon/**
    - component_id: terminus
      name: terminus
      paths:
        - crates/terminus/**
    - component_id: bobcat-core
      name: bobcat-core
      paths:
        - crates/bobcat-core/**
    - component_id: bobcat-source
      name: bobcat-source
      paths:
        - crates/bobcat-source/**
    - component_id: bobcat-resources
      name: bobcat-resources
      paths:
        - crates/bobcat-resources/**
    - component_id: bobcat-cli
      name: bobcat-cli
      paths:
        - crates/bobcat-cli/**
    # No bobcat-wasm component: the browser embedder is wasm32-only and its
    # tests run under wasm-pack, which reports no coverage.
    - component_id: quickjs-rust-bridge
      name: quickjs-rust-bridge
      paths:
        - crates/quickjs-rust-bridge/**
    - component_id: prime-radiant
      name: prime-radiant
      paths:
        - crates/prime-radiant/**

comment:
  after_n_builds: 2
  layout: "condensed_header, diff, components"
  behavior: default
  require_changes: false
