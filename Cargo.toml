[workspace]
resolver = "3"
members = ["crates/*"]
# `fuzz` is a cargo-fuzz package: libFuzzer-only, and it links a sanitizer
# runtime, so it must stay out of the workspace build that CI, coverage and
# CodSpeed run. `.github/workflows/fuzz.yml` builds it on its own.
exclude = ["vendor/stylo", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/akiwah/lynx-vello"
rust-version = "1.95"

[workspace.dependencies]
bobcat-core = { path = "crates/bobcat-core", default-features = false }
lynx-template-decoder = { path = "crates/lynx-template-decoder" }
lynx-xml = { path = "crates/lynx-xml" }
hughie = { path = "crates/hughie" }
flashbulb = { path = "crates/flashbulb" }
quickjs-rust-bridge = { path = "crates/quickjs-rust-bridge" }
dom = { path = "crates/dom" }

stylo = { path = "vendor/stylo/style", package = "stylo", features = ["lynx"] }
stylo_atoms = { path = "vendor/stylo/stylo_atoms" }
stylo_dom = { path = "vendor/stylo/stylo_dom" }
stylo_traits = { path = "vendor/stylo/style_traits", package = "stylo_traits" }
style_traits = { path = "vendor/stylo/style_traits", package = "stylo_traits" }
selectors = { path = "vendor/stylo/selectors" }
servo_arc = { path = "vendor/stylo/servo_arc" }

app_units = "0.7"
bytecheck = "0.6"
bytes = "1"
cc = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cssparser = "0.37"
divan = { package = "codspeed-divan-compat", version = "5" }
euclid = "0.22"
html5ever = "0.39"
http = "1"
getrandom = "0.4.3"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
fast_image_resize = "6.1"
data-url = "0.3"
markup5ever_rcdom = "0.39"
parley = { version = "0.11", default-features = false, features = [
    "std",
    "system",
] }
parking_lot_core = { version = "0.9", features = ["nightly"] }
pollster = "1"
png = "0.18"
rkyv = { version = "0.7", features = ["validation"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
smallvec = { version = "1", features = ["const_new", "union"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync"] }
tokio-util = "0.7"
url = "2"
js-sys = "0.3"
rayon = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
# wasm_thread 0.3.3 forwards Worker-originated spawns to its parent through a
# private control message. Bobcat's explicit OffscreenCanvas embedder Worker
# has no such parent handler, so use the upstream opt-in that directly creates
# a nested module Worker (supported by the Chrome 135 browser floor).
wasm_thread = { git = "https://github.com/utooland/wasm_thread", rev = "94438ff771ee0a6a55d79e49a655707970acb615", features = ["spawn_from_worker"] }
web-sys = "0.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFArray",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "std",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "std",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "CGImageDestination",
    "CGImageProperties",
    "CGImageSource",
    "objc2-core-graphics",
    "std",
] }
vello = { version = "0.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
