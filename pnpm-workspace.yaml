packages:
  - examples/*
  - packages/*
  - crates/bobcat-wasm

enablePrePostScripts: false
engineStrict: true
hoistWorkspacePackages: true
ignorePatchFailures: false
optimisticRepeatInstall: true
publicHoistPattern: []
resolutionMode: "lowest-direct"
strictPeerDependencies: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@lynx-js/*"
  - "@rspack/*"
  - "@rsbuild/*"
  - "@rstest/*"
minimumReleaseAgeStrict: false

catalog:
  "@lynx-js/config-rsbuild-plugin": "0.1.1"
  "@lynx-js/external-bundle-rsbuild-plugin": "0.4.0"
  "@lynx-js/gesture-runtime": "2.1.3"
  "@lynx-js/lynx-bundle-rslib-config": "0.6.0"
  "@lynx-js/lynx-core": "0.1.4"
  "@lynx-js/motion": "0.0.3"
  "@lynx-js/preact-devtools": "5.0.1-20260716151326-abdb87c"
  "@lynx-js/qrcode-rsbuild-plugin": "0.6.0"
  "@lynx-js/react": "0.123.0"
  "@lynx-js/react-rsbuild-plugin": "0.18.0"
  "@lynx-js/react-umd": "0.123.0"
  "@lynx-js/rspeedy": "0.16.0"
  "@lynx-js/tailwind-preset": "0.5.0"
  "@lynx-js/template-webpack-plugin": "0.13.0"
  "@lynx-js/types": "4.0.0"
  "@lynx-js/web-core": "0.22.2"
  "@lynx-js/web-elements": "0.12.6"
  "@types/node": "24.13.2"
  # The workspace compiler: every program is type-checked, and the bobcat-wasm
  # facade emitted, by TypeScript 7.
  typescript: "7.0.2"

catalogs:
  rspack:
    "@rspack/core": "2.1.4"
  # `@lynx-js/rspeedy` loads `lynx.config.ts` through a Node module hook that
  # imports the classic `typescript` compiler API as it loads, and its peer
  # range stops at 5.9. TypeScript 7 has no such API, so every rspeedy project
  # installs this compiler for that hook alone; TypeScript 7 at the root is what
  # checks those projects. Drop this once rspeedy's loader stops importing it.
  rspeedy:
    typescript: "5.9.3"

strictDepBuilds: true

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: false

overrides:
  "@rspack/core": "catalog:rspack"
  "@rsbuild/core>@rspack/core": "catalog:rspack"
  "@rsdoctor/rspack-plugin>@rspack/core": "catalog:rspack"
  "@rsdoctor/types>@rspack/core": "catalog:rspack"
