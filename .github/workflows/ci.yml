name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes the run still in flight. Pushes to
# main never cancel each other: every merge keeps its benchmark samples, its
# coverage upload and its Pages deployment.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test + coverage (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true
          # This job is the one that runs tests, so it is the one that needs
          # the corpus `crates/bobcat-source/tests/web_core_e2e.rs` boots.
          corpus: true

      - name: Install pinned toolchain
        run: rustup toolchain install

      # No Homebrew LLVM: nothing here targets wasm32, and Apple's clang builds
      # QuickJS for the host. The `browser` job installs LLVM 22 for the
      # wasm32 C objects.
      - uses: Swatinem/rust-cache@v2
        with:
          # Seed reusable Rust build artifacts on main. PRs can restore the
          # base branch's cache, but must not fill the repository's cache quota
          # with merge-ref entries that other PRs cannot reuse.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The stylo fork's tests below build in vendor/stylo/target, a
          # second Cargo workspace; naming it keeps those dependencies cached.
          workspaces: |
            . -> target
            vendor/stylo -> target

      - name: Format
        # The package list used to be written out by hand here and had drifted:
        # lynx-xml was never checked. The script asks Cargo for the members
        # instead, so a new crate is covered the moment it joins the workspace.
        run: ./.github/scripts/fmt-check.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: APFS worktree cache hook
        run: python3 .github/scripts/test-worktree-cow.py -v

      - name: Independent `cli` embedder feature
        # `cli` alone is the one feature set only macOS can check: it pulls in
        # winit and `cli/macos.rs`. `server` alone, and no feature at all,
        # compile the same everywhere; the `linux-embedders` job checks them.
        run: cargo clippy --locked -p bobcat-cli --no-default-features --features cli --all-targets --no-deps -- -D warnings

      - name: Benchmarks measure the shipped feature set
        # Cargo unifies dev-dependency features into the library itself, so
        # `cargo codspeed build` can measure a library production never ships.
        # Two such deviations exist and are recorded in the script; this fails
        # on a third appearing, or on a recorded one going away unnoticed.
        run: python3 .github/scripts/check-bench-feature-parity.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Tests + coverage
        # One instrumented build and one run of every test. Per-crate coverage
        # is Codecov's job (`codecov.yml` names the components); there is no
        # coverage threshold in this workflow.
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|/)vendor(/|$)'

      # A golden that differs leaves `-expected`/`-actual`/`-diff` PNGs beside
      # its golden directory (`crates/*/tests/artifacts`); keep them, so a
      # rendering that differs only on this runner can be read.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: crates/*/tests/artifacts/
          if-no-files-found: ignore

      - name: Stylo fork Lynx tests
        run: |
          targets=""
          for file in vendor/stylo/style/tests/lynx_*.rs; do
            name="$(basename "$file" .rs)"
            [ "$name" = "lynx_feature_off_parity" ] && continue
            targets="$targets --test $name"
          done
          echo "discovered:$targets"
          cargo test --manifest-path vendor/stylo/Cargo.toml -p stylo --features lynx $targets

      - name: Doctests
        run: cargo test --doc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  browser:
    name: threaded Wasm + Pages build (Ubuntu)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # `actions/configure-pages` reads the site's base path on pushes to main.
      pages: read
    env:
      CC: clang-22
      CXX: clang++-22
      CC_wasm32_unknown_unknown: clang-22
      AR_wasm32_unknown_unknown: llvm-ar-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Clippy (wasm32)
        # The macOS job's `cargo clippy` runs for the host, where every
        # wasm32-gated item is `cfg`-ed out — `crates/bobcat-wasm/src/browser.rs`
        # is the whole browser embedder and had never been linted, or even
        # type-checked, by CI. This job already carries the LLVM 22 toolchain
        # the target needs.
        #
        # `--lib` rather than `--all-targets`. bobcat-core's own tokio
        # dependency builds here: its features are target-gated to `rt`,
        # `sync` and `macros`, with `time` enabled only off wasm32, because
        # tokio's timer reads `std::time::Instant` and that target uses
        # `src/alarm.rs` instead. The dev dependency is what `--lib` avoids —
        # it asks for `rt-multi-thread`, which does not compile for wasm32 at
        # all, and feature unification would drag it into any build that
        # includes dev targets. The packages are named rather than
        # `--workspace` because bobcat-cli is a native embedder crate that
        # does not target wasm32.
        run: >-
          cargo clippy --target wasm32-unknown-unknown --lib
          -p vant
          -p bobcat-wasm
          -p bobcat-resources
          -p bobcat-core
          -p terminus
          -p seldon
          -p bobcat-source
          -p quickjs-rust-bridge
          -- -D warnings

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build threaded wasm-bindgen bindings and the TypeScript facade
        # wasm-pack first, then TypeScript 7 emits `dist/`: the Workers are
        # typed against the glue wasm-pack generates, so this is where they
        # are checked.
        run: pnpm --filter bobcat-wasm build

      - name: Decode bundles and ZIP resources in Wasm
        run: >-
          wasm-pack test --node crates/bobcat-source
          --test decode_web_bundle --test zip_source --locked -Z build-std=std,panic_abort

      - name: Test the bobcat-wasm package scripts
        # These unit tests take seconds; leaked MessagePorts must not hold a
        # runner (and the main CI concurrency group) for the six-hour default.
        timeout-minutes: 2
        run: pnpm --filter bobcat-wasm test

      - name: Build the Explorer homepage for the Canvas tab
        run: pnpm --filter @explorer/homepage build

      - name: Build the Explorer showcase the homepage opens
        run: pnpm --filter @explorer/showcase build

      - name: Configure Pages
        # Only a push to main builds for the real site; the base path it
        # resolves is what `deploy-pages` publishes under.
        if: github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages
        run: pnpm --filter github-pages build
        env:
          # Pull requests build under a stand-in path, which proves the base
          # path is honoured without touching the deployed site.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/ci-preview' }}

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/github-pages/dist

  deploy-pages:
    name: Deploy GitHub Pages
    # The site is the `browser` job's build of this same commit; the former
    # Pages workflow built it a second time on every push to main.
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  linux-embedders:
    name: native Bobcat embedders type-check + clippy (Ubuntu)
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      # The CLI, HTTP server, and their source adapter are the native workspace
      # products no other job compiles on Linux. The macOS job builds them
      # there; the Ubuntu benchmark job builds
      # terminus/seldon/quickjs-rust-bridge through their bench targets but never
      # reaches these embedders, which nothing depends on. Without this job the
      # headless runners — the modes Linux hosts actually run — have no gate
      # compiling them at all.
      #
      # No tests: both native runners have end-to-end GPU screenshot cases,
      # and a hosted runner has no adapter.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install system dependencies
        # libfontconfig1-dev is a build-time dependency of parley's `system`
        # font source, which the CLI reaches through terminus.
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22 libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: linux-embedders

      - name: Clippy
        run: >-
          cargo clippy
          -p bobcat-source
          -p bobcat-cli
          --all-targets --no-deps -- -D warnings

      - name: Independent embedder features
        # Each feature set on its own, headless. The macOS job checks `cli`
        # alone as well, for the winit half that only exists there.
        run: |
          cargo clippy --locked -p bobcat-cli --no-default-features --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p bobcat-cli --no-default-features --features cli --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p bobcat-cli --no-default-features --features server --all-targets --no-deps -- -D warnings

  typescript:
    name: TypeScript workspace type-check + emit + Element PAPI tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      # No submodules and no Rust toolchain. TypeScript 7 checks every program
      # in the workspace — the realm runtime, the bobcat-wasm facade and
      # scripts, the Pages site and every example — and re-emits the realm
      # runtime bobcat-core compiles during its own build; the realm runtime
      # is then tested over a native mock. The one program left
      # out is the bobcat-wasm Workers': they are typed against wasm-pack's
      # glue, so the `browser` job's package build checks them.
      - uses: actions/checkout@v6

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript

      - name: Type-check the workspace
        run: pnpm test:type

      - name: Build the realm runtime from source
        run: |
          pnpm --filter bobcat-element build
          test -z "$(git ls-files packages/bobcat-element/dist)"

      - name: Test the Element PAPI runtime
        run: pnpm --filter bobcat-element test

      - name: Build latest-engine ReactLynx fixtures
        run: pnpm --filter reactlynx-test-fixtures build

      - name: Build the Lynx Explorer pages
        run: pnpm build:explorer

  sanitizers:
    name: AddressSanitizer + UBSan tests — QuickJS bridge, core, resources (macOS)
    runs-on: macos-latest
    env:
      # `--target` below keeps this off build scripts and proc macros, which
      # run on the host uninstrumented. The bridge's build script reads it
      # and instruments the QuickJS C to match (`Instrumentation` in
      # `crates/quickjs-rust-bridge/build.rs`).
      RUSTFLAGS: -Zsanitizer=address
      UBSAN_OPTIONS: print_stacktrace=1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      # The crates that hold C and `unsafe`: the bridge with the QuickJS fork
      # and its shim, the core that drives every realm, worker and module
      # load through them, and the resources' platform FFI (ImageIO, curl).
      # macOS because their suites include GPU screenshot cases, which only
      # this platform's runners can run; the Ubuntu job below adds
      # LeakSanitizer for the bridge alone.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Homebrew
        # Apple's Clang instruments C for a sanitizer runtime of its own,
        # which rustc's does not link.
        run: |
          brew install llvm@22
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"
          echo "ASAN_SYMBOLIZER_PATH=$(brew --prefix llvm@22)/bin/llvm-symbolizer" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: sanitizers

      - name: Tests under AddressSanitizer and UBSan
        # The `sanitize` profile is opt-level 1, the level AddressSanitizer
        # is meant for. `--tests` leaves out doctests, which rustdoc builds
        # without these RUSTFLAGS.
        run: >-
          cargo test --locked --profile sanitize --target aarch64-apple-darwin --tests
          -p quickjs-rust-bridge
          -p bobcat-core
          -p bobcat-resources

  quickjs-unsafe:
    name: QuickJS bridge — LeakSanitizer tests, Miri, fuzzing (Ubuntu)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      CC: clang-22
      CXX: clang++-22
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-22
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain and Miri
        run: |
          rustup toolchain install
          rustup component add miri

      - name: Install LLVM 22 from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          shared-key: quickjs-unsafe
          # The fuzz targets are a Cargo workspace of their own.
          workspaces: |
            . -> target
            crates/quickjs-rust-bridge/fuzz -> target

      - name: Bridge tests under AddressSanitizer, LeakSanitizer and UBSan
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: >-
          cargo test --locked --profile sanitize --target x86_64-unknown-linux-gnu --tests
          -p quickjs-rust-bridge

      - name: Miri over the C hooks implemented in Rust
        # The allocator and string functions QuickJS calls are Rust, and
        # their unit tests call them directly, so Miri can check them; the
        # rest of the bridge is calls into C, which Miri cannot run. Miri
        # perturbs float results by design; `atanh`'s test compares bits.
        env:
          MIRIFLAGS: -Zmiri-deterministic-floats
        run: >-
          cargo miri test --locked -p quickjs-rust-bridge --lib --
          allocator:: platform_stdlib::

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz targets are locked and lint-clean
        run: |
          cargo fetch --locked --manifest-path crates/quickjs-rust-bridge/fuzz/Cargo.toml
          cargo clippy --locked --manifest-path crates/quickjs-rust-bridge/fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@v4
        with:
          path: crates/quickjs-rust-bridge/fuzz/corpus
          key: quickjs-fuzz-corpus-${{ github.run_id }}
          restore-keys: quickjs-fuzz-corpus-

      - name: Replay the fuzz corpus
        # Every input main's fuzzing has kept, run once with no mutation: a
        # pull request fails here only on an input that passed before it.
        if: github.event_name == 'pull_request'
        run: ./.github/scripts/fuzz-quickjs.sh replay

      - name: Fuzz for five minutes per target
        if: github.event_name == 'push'
        run: ./.github/scripts/fuzz-quickjs.sh fuzz 300

      - name: Save the fuzz corpus
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: crates/quickjs-rust-bridge/fuzz/corpus
          key: quickjs-fuzz-corpus-${{ github.run_id }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-fuzz-artifacts
          path: crates/quickjs-rust-bridge/fuzz/artifacts/
          if-no-files-found: ignore

  walltime-benchmarks:
    name: bench (CodSpeed walltime, macOS)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, lynx-vello-macos-gpu]
    timeout-minutes: 180
    concurrency:
      group: lynx-vello-macos-walltime-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: /Users/admin/.cache/lynx-vello-cargo-target
      HOMEBREW_NO_AUTO_UPDATE: 1
      PATH: /Users/admin/.cargo/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Homebrew
        # Kept on this runner alone: the compiler that builds QuickJS's C
        # objects is part of what the walltime series has been measuring.
        run: |
          brew install llvm@22
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install cargo-codspeed 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@5

      - name: Build benchmarks
        run: cargo codspeed build -m walltime

      - name: Run benchmarks (CodSpeed, walltime)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: cargo codspeed run -m walltime
          token: ${{ secrets.CODSPEED_TOKEN }}

  memory-benchmarks:
    name: bench (CodSpeed memory, Ubuntu)
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up workspace JavaScript
        uses: ./.github/actions/setup-javascript
        with:
          fixtures: true

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install benchmark system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22 libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-codspeed 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@5

      - name: Cache Rust compilation by content
        # rust-cache removes path dependencies under the checkout, including
        # vendor/stylo. sccache can reuse their compilation even when Cargo
        # rebuilds after a fresh checkout. Benchmark linking remains uncached.
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Build benchmarks (CodSpeed, memory)
        # `cargo build --benches` underneath, in the bench profile: thin LTO
        # and one codegen unit per crate, so every library sets `bench = false`
        # to keep this to the `benches/` targets and their dependencies.
        run: cargo codspeed build -m memory
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # Keep the existing main-only cache-write policy; PR merge-ref
          # caches cannot seed other PRs and would compete for cache space.
          SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

      - name: Run benchmarks (CodSpeed, memory)
        uses: CodSpeedHQ/action@v4
        with:
          mode: memory
          run: cargo codspeed run -m memory
          token: ${{ secrets.CODSPEED_TOKEN }}
