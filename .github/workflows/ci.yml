name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test + coverage (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Homebrew
        run: |
          brew install llvm@22
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # The package list used to be written out by hand here and had drifted:
        # lynx-xml was never checked. The script asks Cargo for the members
        # instead, so a new crate is covered the moment it joins the workspace.
        run: ./.github/scripts/fmt-check.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Benchmarks measure the shipped feature set
        # Cargo unifies dev-dependency features into the library itself, so
        # `cargo codspeed build` can measure a library production never ships.
        # Two such deviations exist and are recorded in the script; this fails
        # on a third appearing, or on a recorded one going away unnoticed.
        run: python3 .github/scripts/check-bench-feature-parity.py

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Tests + coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|/)vendor(/|$)'

      - name: Hughie 95% coverage gate
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p hughie --locked --summary-only \
            --ignore-filename-regex '(^|/)(tests|benches|vendor)(/|$)' \
            --fail-under-lines 95

      - name: Stylo fork Lynx tests
        run: |
          targets=""
          for file in vendor/stylo/style/tests/lynx_*.rs; do
            name="$(basename "$file" .rs)"
            [ "$name" = "lynx_feature_off_parity" ] && continue
            targets="$targets --test $name"
          done
          echo "discovered:$targets"
          cargo test --manifest-path vendor/stylo/Cargo.toml -p stylo --features lynx $targets

      - name: Doctests
        run: cargo test --doc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  browser:
    name: threaded Wasm + Pages build (Ubuntu)
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
      CC_wasm32_unknown_unknown: clang-22
      AR_wasm32_unknown_unknown: llvm-ar-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-wasm

      - name: Clippy (wasm32)
        # The macOS job's `cargo clippy` runs for the host, where every
        # wasm32-gated item is `cfg`-ed out — `crates/bobcat-wasm/src/browser.rs`
        # is the whole browser embedder and had never been linted, or even
        # type-checked, by CI. This job already carries the LLVM 22 toolchain
        # the target needs.
        #
        # `--lib` rather than `--all-targets`: bobcat-core dev-depends on
        # tokio's `rt-multi-thread`, which refuses to compile for wasm32, and
        # feature unification would drag it into any build that includes dev
        # targets. The packages are named rather than `--workspace` because
        # bobcat-cli is a native binary that does not target wasm32 at all.
        run: >-
          cargo clippy --target wasm32-unknown-unknown --lib
          -p bobcat-wasm
          -p bobcat-core
          -p dom
          -p hughie
          -p lynx-xml
          -p lynx-template-decoder
          -p quickjs-rust-bridge
          -- -D warnings

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build threaded wasm-bindgen bindings
        run: pnpm --filter bobcat-wasm build

      - name: Verify shared-memory and npm artifacts
        run: pnpm --filter bobcat-wasm verify

      - name: Type-check GitHub Pages
        run: pnpm --filter github-pages test:type

      - name: Build GitHub Pages
        run: pnpm --filter github-pages build
        env:
          PAGES_BASE_PATH: /ci-preview

  linux-cli:
    name: bobcat-cli type-check + clippy (Ubuntu)
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      # bobcat-cli is the one workspace member no job compiles on Linux. The
      # macOS job builds it there; the Ubuntu benchmark job builds
      # dom/hughie/quickjs-rust-bridge through their bench targets but never
      # reaches the CLI, which nothing depends on. Without this job the
      # headless runner — the mode Linux hosts actually run — has no gate
      # compiling it at all.
      #
      # No tests: the CLI's dev-dependencies pull in flashbulb's GPU capture,
      # and a hosted runner has no adapter.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install system dependencies
        # libfontconfig1-dev is a build-time dependency of parley's `system`
        # font source, which the CLI reaches through dom.
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22 libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cli

      - name: Clippy
        run: cargo clippy -p bobcat-cli --all-targets --no-deps -- -D warnings

  element-papi:
    name: Element PAPI runtime tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      # No submodules and no Rust toolchain: the runtime is a single
      # JavaScript file tested over a native mock, so this job needs only the
      # pnpm workspace.
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Element PAPI runtime
        run: pnpm --filter bobcat-element test

      - name: Type-check the Element PAPI runtime
        run: pnpm --filter bobcat-element test:type

  walltime-benchmarks:
    name: bench (CodSpeed walltime, macOS)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, lynx-vello-macos-gpu]
    timeout-minutes: 180
    concurrency:
      group: lynx-vello-macos-walltime-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CARGO_TARGET_DIR: /Users/admin/.cache/lynx-vello-cargo-target
      HOMEBREW_NO_AUTO_UPDATE: 1
      PATH: /Users/admin/.cargo/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      WGPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Homebrew
        run: |
          brew install llvm@22
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"

      - name: Install cargo-codspeed 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@5

      - name: Build benchmarks
        run: cargo codspeed build -m walltime

      - name: Run benchmarks (CodSpeed, walltime)
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: cargo codspeed run -m walltime
          token: ${{ secrets.CODSPEED_TOKEN }}

  memory-benchmarks:
    name: bench (CodSpeed memory, Ubuntu)
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Install benchmark system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22 libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-codspeed 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed@5

      - name: Build benchmarks (CodSpeed, memory)
        run: cargo codspeed build -m memory

      - name: Run benchmarks (CodSpeed, memory)
        uses: CodSpeedHQ/action@v4
        with:
          mode: memory
          run: cargo codspeed run -m memory
          token: ${{ secrets.CODSPEED_TOKEN }}
