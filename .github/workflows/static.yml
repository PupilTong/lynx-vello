name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build threaded Wasm site
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
      CC_wasm32_unknown_unknown: clang-22
      AR_wasm32_unknown_unknown: llvm-ar-22
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install LLVM 22 from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 llvm-22

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser-wasm

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build threaded wasm-bindgen bindings
        run: pnpm --filter bobcat-wasm build

      - name: Verify shared-memory and npm artifacts
        run: pnpm --filter bobcat-wasm verify

      - name: Type-check GitHub Pages
        run: pnpm --filter github-pages test:type

      - name: Build GitHub Pages
        run: pnpm --filter github-pages build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/github-pages/dist
  deploy:
    name: Deploy GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
